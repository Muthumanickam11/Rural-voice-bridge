    - "மூச்சு விட முடியல"
    - "ரத்தப்போக்கு"
    - "விபத்து ஆம்புலன்ஸ்"
  keywords_en:
    - "snake bite"
    - "chest pain"
    - "heart attack"
    - "cannot breathe"
    - "can't breathe"
    - "ambulance"
    - "severe bleeding"
    - "unconscious"
    - "not breathing"
    - "fainted and not waking"
    - "accident"
  patterns:
    - "(?i)(snake bite|chest pain|heart attack|ambulance|severe bleeding|cannot breathe|can'?t breathe|unconscious|not breathing)"
